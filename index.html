function diagram(v){if(v==='matrix')return '<table class="matrix"><tr><td>3</td><td>4</td><td>5</td></tr><tr><td>6</td><td>7</td><td>8</td></tr><tr><td>9</td><td>10</td><td>11</td></tr></table><small>Rows ↓ · Columns →</small>';if(v==='array')return '<div class="row"><table class="matrix"><tr><td>1</td><td>3</td></tr><tr><td>2</td><td>4</td></tr></table><table class="matrix"><tr><td>5</td><td>7</td></tr><tr><td>6</td><td>8</td></tr></table></div><small>Layer 1 → Layer 2</small>';if(v==='list')return '<div class="cells"><div class="cell">"Ana"<small>name</small></div><div class="cell">22<small>age</small></div><div class="cell">90,85<small>scores</small></div></div>';if(v==='dataframe')return '<table class="matrix"><tr><td>name</td><td>age</td></tr><tr><td>Ana</td><td>20</td></tr><tr><td>Ben</td><td>25</td></tr></table>';if(v==='vector')return '<div class="cells">'+[10,20,30].map((x,i)=>'<div class="cell">'+x+'<small>['+(i+1)+']</small></div>').join('')+'</div>';return '<div class="muted">Follow the example below step by step.</div>'}
function codeBlock(code){return '<div class="code"><div class="codehead">R code <button class="btn secondary" data-copy="'+encodeURIComponent(code)+'">Copy</button></div><pre>'+esc(code)+'</pre></div>'}
function topicCard(t,type){return '<button class="card" data-open="'+esc(type+':'+(type==='lesson'?t.id:t.name))+'"><div class="row"><strong>'+esc(t.name)+'</strong><span class="tag">'+esc(type==='lesson'?'Lesson':t.category)+'</span></div><small>'+esc(t.summary||t.description)+'</small></button>'}
function home(){let completed=done.size;return '<div class="hero"><div class="eyebrow">YOUR POCKET R COMPANION</div><h1>Learn R, one idea at a time.</h1><p>Search the dictionary, follow a course, or revisit a concept in seconds.</p><input id="quickSearch" class="search" placeholder="Search mean(), matrix(), ggplot…" aria-label="Search R"></div><div class="panel"><div class="row"><strong>Your learning progress</strong><span class="muted small">'+completed+' / '+L.length+' lessons</span></div><div class="progress" style="margin:13px 0"><div style="width:'+(100*completed/L.length)+'%"></div></div><button class="btn" data-screen="learn">Continue learning →</button></div><h3>Start with your handwritten topics</h3>'+['lists','matrix','arrays'].map(id=>topicCard(L.find(l=>l.id===id),'lesson')).join('')+'<div class="panel"><h3>What is inside?</h3><p class="muted">'+catalog.length+' searchable function names · '+L.length+' guided lessons · '+PACKAGES.length+' package guides · '+ADVANCED.length+' advanced topics · example outputs · quizzes · saved references · scratchpad.</p><p class="small muted">Outputs are illustrative, not calculated by the app. Some entries use R’s official example() command; packages must be installed separately.</p></div>'}
function dictionary(){const categories=['All',...new Set(catalog.map(x=>x.category))];const q=term.toLowerCase().trim();let results=catalog.filter(x=>(cat==='All'||cat===x.category)&&[x.name,x.description,x.category,x.params].join(' ').toLowerCase().includes(q));return '<h2>R Dictionary</h2><div class="tip"><b>Scope:</b> R is an extensible language with thousands of packages. This offline edition indexes 350 selected functions, not every function in R. Worked outputs are examples, not live execution. For functions without a worked output, the provided code opens official R help and examples.</div><div class="tip"><b>Scope:</b> R is an extensible language with thousands of packages. This offline edition indexes 350 selected functions, not every function in R. Worked outputs are examples, not live execution. For functions without a worked output, the provided code opens official R help and examples.</div><p class="muted">Search '+catalog.length+' function entries, with worked examples and official-help recipes.</p><input id="dictSearch" class="search" value="'+esc(term)+'" placeholder="Search functions or topics…" aria-label="Dictionary search"><div class="tabs">'+categories.map(x=>'<button class="pill '+(cat===x?'active':'')+'" data-cat="'+esc(x)+'">'+esc(x)+'</button>').join('')+'</div><p class="muted small">'+results.length+' results</p>'+results.slice(0,120).map(x=>topicCard(x,'function')).join('')+(results.length>120?'<p class="muted">Showing first 120. Refine your search to see more.</p>':'')}
function learn(){return '<h2>Learn R from Scratch</h2><div class="panel"><h3>Next: expand your skills</h3><button class="btn" data-screen="paths">Packages & Advanced R →</button></div><p class="muted">Follow these guided lessons in order. Check off each one as you finish.</p>'+tracks.map((t,i)=>'<div class="panel"><h3>Chapter '+(i+1)+': '+esc(t.name)+'</h3>'+t.ids.map((id,j)=>{let l=L.find(x=>x.id===id);return l?'<button class="card" data-open="lesson:'+esc(l.id)+'"><div class="row"><strong>'+(done.has(l.id)?'✓ ':'')+esc(l.name)+'</strong><span class="tag">'+(done.has(l.id)?'Done':'Lesson '+(j+1))+'</span></div><small>'+esc(l.summary)+'</small></button>':''}).join('')+'</div>').join('')+'<p class="muted small">You can also open any topic from the dictionary without following the course.</p>'}

function paths(){return '<h2>Explore more R</h2><p class="muted">When you are ready, dive into packages or advanced concepts. Both are available offline.</p><button class="card" data-screen="packages"><strong>📦 Package Library</strong><small>'+PACKAGES.length+' packages · '+PACKAGES.reduce((n,p)=>n+p.topics.length,0)+' annotated examples · Install, syntax, output and common pitfalls</small></button><button class="card" data-screen="advanced"><strong>🧠 Advanced R</strong><small>'+ADVANCED.length+' guided topics · Object systems, environments, performance, metaprogramming and more</small></button>'}
function packagesPage(){return '<button class="btn secondary" data-screen="paths">← Explore</button><h2>📦 R Packages</h2><p class="muted">Select a package for a beginner-friendly overview, installation instructions and four worked usage examples.</p><input id="pkgSearch" class="search" placeholder="Search packages or functions…" value="'+esc(pkgTerm)+'">'+PACKAGES.filter(p=>(p.name+' '+p.category+' '+p.summary+' '+p.topics.map(t=>t.name).join(' ')).toLowerCase().includes(pkgTerm.toLowerCase())).map(p=>'<button class="card" data-open="package:'+esc(p.id)+'"><div class="row"><strong>'+esc(p.name)+'</strong><span class="tag">'+p.topics.length+' examples</span></div><small>'+esc(p.summary)+'</small></button>').join('')}
function advancedPage(){return '<button class="btn secondary" data-screen="paths">← Explore</button><h2>🧠 Advanced R</h2><p class="muted">A suggested progression beyond the beginner course. Lessons include worked examples, output, a mental model and a challenge.</p><div class="panel"><div class="row"><strong>Advanced progress</strong><span class="muted small">'+ADVANCED.filter(a=>done.has(a.id)).length+' / '+ADVANCED.length+'</span></div><div class="progress"><div style="width:'+(100*ADVANCED.filter(a=>done.has(a.id)).length/ADVANCED.length)+'%"></div></div></div>'+ADVANCED.map((a,i)=>'<button class="card" data-open="advanced:'+a.id+'"><div class="row"><strong>'+(done.has(a.id)?'✓ ':'')+(i+1)+'. '+esc(a.name)+'</strong><span class="tag">'+(done.has(a.id)?'Done':'Study')+'</span></div><small>'+esc(a.summary)+'</small></button>').join('')}
function pathDetail(){let [kind,id]=selected.split(':');let p=kind==='package'?PACKAGES.find(x=>x.id===id):ADVANCED.find(x=>x.id===id);if(!p)return '<p>Not found</p>';let out='<button class="btn secondary" data-back="1">← Back</button><div class="panel"><div class="eyebrow">'+(kind==='package'?'PACKAGE LIBRARY':'ADVANCED R')+'</div><div class="row"><h2>'+esc(p.name)+'</h2><button class="btn secondary" data-save="1">'+(saved.has(selected)?'★ Saved':'☆ Save')+'</button></div><p class="muted">'+esc(p.summary)+'</p>';
if(kind==='package'){out+='<div class="tip"><b>What it is for:</b> '+esc(p.summary)+'.</div><h3>Install once</h3>'+codeBlock('install.packages("'+p.name+'")')+'<h3>Load in each new session</h3>'+codeBlock('library('+p.name+')')+'<div class="warning"><b>Note:</b> Package examples may require example data, files or additional packages. This app displays illustrative results; it does not execute code.</div>';p.topics.forEach((t,i)=>{out+='<div class="section"><h3>'+(i+1)+'. '+esc(t.name)+'</h3><p class="muted">'+esc(t.summary)+'</p>'+codeBlock(t.code)+'<h4>What to expect</h4><div class="output">'+esc(t.output)+'</div></div>'});out+='<div class="tip">For all package functions and arguments, run '+esc('help(package = "'+p.name+'")')+' in R. Package versions can change behavior.</div>'}else{out+='<div class="section"><h3>Understand it</h3><p>'+esc(p.explain)+'</p></div><div class="section"><h3>Example code</h3>'+codeBlock(p.code)+'</div><div class="section"><h3>Expected result</h3><div class="output">'+esc(p.output)+'</div></div><div class="tip"><b>Try it yourself:</b> '+esc(p.challenge)+'</div><button class="btn" data-done="1">'+(done.has(p.id)?'✓ Completed — mark incomplete':'Mark topic complete ✓')+'</button>'}return out+'</div>'}

function savedPage(){let items=[...saved].map(key=>{let [kind,...parts]=key.split(':');let name=parts.join(':');return kind==='lesson'?L.find(l=>l.id===name):kind==='package'?PACKAGES.find(p=>p.id===name):kind==='advanced'?ADVANCED.find(a=>a.id===name):catalog.find(c=>c.name===name)}).filter(Boolean);return '<h2>Saved references</h2><p class="muted">Your favorites are stored on this device.</p>'+(items.length?items.map(t=>topicCard(t,t.id?(PACKAGES.some(p=>p.id===t.id)?'package':ADVANCED.some(a=>a.id===t.id)?'advanced':'lesson'):'function')).join(''):'<div class="panel muted">Nothing saved yet. Open a lesson or function and tap ☆ Save.</div>')}
function playground(){return '<h2>R Scratchpad</h2><p class="muted">Draft R code, keep notes, and copy it into RStudio or another R interpreter.</p><textarea id="scratch" spellcheck="false" aria-label="R scratchpad">'+esc(scratch)+'</textarea><div class="row" style="margin-top:12px"><span class="muted small" id="scratchState">Saved on this device</span><button class="btn" id="copyScratch">Copy code</button></div><div class="warning" style="margin-top:20px"><b>Execution limitation:</b> This offline app does not run R code. It never claims to calculate the results of your scratchpad.</div>'}
function detail(){let [kind,...parts]=selected.split(':');let key=parts.join(':');let l=kind==='lesson'?L.find(x=>x.id===key):catalog.find(x=>x.name===key);if(!l)return '<p>Topic not found.</p>';let favorite=saved.has(selected);let lesson=kind==='lesson';let out='<button class="btn secondary" data-back="1">← Back</button><div class="panel"><div class="eyebrow">'+esc(lesson?l.cat:l.category)+' · '+(lesson?'GUIDED LESSON':'FUNCTION REFERENCE')+'</div><div class="row"><h2>'+esc(l.name)+'</h2><button class="btn secondary" data-save="1">'+(favorite?'★ Saved':'☆ Save')+'</button></div><p class="muted">'+esc(l.summary||l.description)+'</p>';
if(lesson){out+='<div class="section"><h3>👀 Picture it</h3><div class="diagram">'+diagram(l.visual)+'</div></div><div class="section"><h3>Syntax</h3>'+codeBlock(l.syntax)+'</div><div class="section"><h3>Try this in R</h3>'+codeBlock(l.code)+'</div><div class="section"><h3>Expected output</h3><div class="output">'+esc(l.output)+'</div></div><div class="section"><h3>Breaking it down</h3><ul>'+l.points.map(p=>'<li>'+esc(p)+'</li>').join('')+'</ul><div class="tip"><b>Remember:</b> '+esc(l.tip)+'</div></div><div class="section"><h3>Common mistake</h3><div class="warning">'+esc(l.id==='matrix'?'R fills matrices down columns by default. Use byrow = TRUE to fill across rows.':l.id==='lists'?'[ ] returns a sublist; [[ ]] extracts one list element. Assign NULL with [ ] to remove an element.':l.id==='arrays'?'Arrays use [row, column, layer]. R fills column-first unless you rearrange the data.':'Check types, missing values, and indexing (R starts counting at 1).')+'</div></div><div class="section"><h3>🧠 Quick check</h3><p>'+esc(l.question)+'</p><button class="btn secondary" data-answer="1">Reveal answer</button><div class="tip '+(quizVisible?'':'hide')+'" id="quizAnswer">'+esc(l.answer)+'</div></div><button class="btn" data-done="1">'+(done.has(l.id)?'✓ Completed — mark incomplete':'Mark lesson complete ✓')+'</button>'}
else{out+='<div class="section"><h3>What it does</h3><p>'+esc(l.description)+'</p></div><div class="section"><h3>Syntax & arguments</h3><div class="tip">'+esc(l.params)+'</div></div><div class="section"><h3>'+(l.verified?'Worked example':'Explore official examples in R')+'</h3>'+codeBlock(l.code)+'</div><div class="section"><h3>'+(l.verified?'Illustrative output':'What this recipe does')+'</h3><div class="output">'+esc(l.output)+'</div></div><div class="warning"><b>Tip:</b> Package functions may require library(package). Check the official help page for all parameters and edge cases.</div>'}
return out+'</div>'}
function flashcards(){let items=catalog.filter(x=>x.verified);let i=Number(localStorage.getItem('rb4card')||0)%items.length;let x=items[i];return '<h2>Practice flashcards</h2><p class="muted">Review worked functions one at a time. Tap reveal to see the code and output.</p><div class="panel"><span class="tag">Card '+(i+1)+' of '+items.length+'</span><h2>'+esc(x.name)+'()</h2><p>'+esc(x.description)+'</p><div id="cardReveal" class="hide"><h3>Example</h3>'+codeBlock(x.code)+'<h3>Expected output</h3><div class="output">'+esc(x.output)+'</div><p class="muted">'+esc(x.params)+'</p></div><div class="row"><button class="btn secondary" data-flash="reveal">Reveal answer</button><button class="btn" data-flash="next">Next card →</button></div></div>'}
function flashcards(){let items=catalog.filter(x=>x.verified);let i=Number(localStorage.getItem('rb4card')||0)%items.length;let x=items[i];return '<h2>Practice flashcards</h2><p class="muted">Review worked functions one at a time. Tap reveal to see the code and output.</p><div class="panel"><span class="tag">Card '+(i+1)+' of '+items.length+'</span><h2>'+esc(x.name)+'()</h2><p>'+esc(x.description)+'</p><div id="cardReveal" class="hide"><h3>Example</h3>'+codeBlock(x.code)+'<h3>Expected output</h3><div class="output">'+esc(x.output)+'</div><p class="muted">'+esc(x.params)+'</p></div><div class="row"><button class="btn secondary" data-flash="reveal">Reveal answer</button><button class="btn" data-flash="next">Next card →</button></div></div>'}
function render(){let root=$('app');root.innerHTML=selected?(selected.startsWith('package:')||selected.startsWith('advanced:')?pathDetail():detail()):({home,dict:dictionary,learn,saved:savedPage,play:playground,flash:flashcards,paths,packages:packagesPage,advanced:advancedPage})[screen]();document.querySelectorAll('[data-screen]').forEach(b=>b.classList.toggle('active',!selected&&b.dataset.screen===screen));}
function goScreen(s){selected=null;screen=s;quizVisible=false;render();scrollTo(0,0)}
document.addEventListener('click',async e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.screen){goScreen(b.dataset.screen);return}if(b.dataset.flash){if(b.dataset.flash==='reveal')$('cardReveal')?.classList.remove('hide');else{localStorage.setItem('rb4card',String((Number(localStorage.getItem('rb4card')||0)+1)%catalog.filter(x=>x.verified).length));render()}return}if(b.dataset.flash){if(b.dataset.flash==='reveal')$('cardReveal')?.classList.remove('hide');else{localStorage.setItem('rb4card',String((Number(localStorage.getItem('rb4card')||0)+1)%catalog.filter(x=>x.verified).length));render()}return}if(b.dataset.open){selected=b.dataset.open;quizVisible=false;render();scrollTo(0,0);return}if(b.dataset.back){selected=null;render();return}if(b.dataset.cat){cat=b.dataset.cat;render();return}if(b.dataset.save){saved.has(selected)?saved.delete(selected):saved.add(selected);saveState();render();return}if(b.dataset.done){let id=selected.split(':')[1];done.has(id)?done.delete(id):done.add(id);saveState();render();return}if(b.dataset.answer){quizVisible=true;$('quizAnswer')?.classList.remove('hide');return}if(b.dataset.copy||b.id==='copyScratch'){let v=b.id==='copyScratch'?scratch:decodeURIComponent(b.dataset.copy);try{await navigator.clipboard.writeText(v);b.textContent='Copied ✓'}catch{b.textContent='Select and copy code'}return}});
document.addEventListener('input',e=>{if(e.target.id==='pkgSearch'){let start=e.target.selectionStart;pkgTerm=e.target.value;render();let inp=$('pkgSearch');inp.focus();inp.setSelectionRange(start,start)}if(e.target.id==='dictSearch'){let start=e.target.selectionStart;term=e.target.value;render();let inp=$('dictSearch');inp.focus();inp.setSelectionRange(start,start)}if(e.target.id==='quickSearch'){term=e.target.value;screen='dict';selected=null;render();$('dictSearch')?.focus()}if(e.target.id==='scratch'){scratch=e.target.value;localStorage.setItem('rb4scratch',scratch);$('scratchState').textContent='Saved locally ✓'}});
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});render();
</script></body></html>
